# Render Blueprint — backend API as a web service.
#
# Connect the repo in Render and pick "Blueprint"; every setting below is
# applied. The secrets (CREWAI_API_KEY and the agent IDs) are marked
# sync: false so Render prompts for them instead of reading them from git.
#
# The frontend is a static Angular build and is deployed separately
# (Vercel: see frontend/vercel.json; or add a Render static site pointing at
# frontend/ with publish path dist/frontend/browser).
#
# FREE TIER: no persistent disk is available, so durable state (data/recon.db,
# run history, batch artefacts) lives in the container filesystem and is lost
# on every deploy or restart. The app still runs — it starts cold with the
# feed queue at file 1 and the estimator on its default constants. The GL
# cache and the 65-file demo feed are tracked in git, so they are always there.
# To keep state, move to a paid plan and uncomment the "disk" block and the
# /var/data paths below.
services:
  - type: web
    name: recon-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker, no --reload: the batch registry, orchestrator and run history
    # are an in-memory cache over the SQLite file.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true

    # Paid plans only (starter and up):
    # disk:
    #   name: recon-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0

      # With a disk, point every data location at it (uncomment with the disk):
      # - key: DB_PATH
      #   value: /var/data/recon.db
      # - key: WORKING_FRAMES_DIR
      #   value: /var/data/working_frames
      # - key: FORECAST_DIR
      #   value: /var/data/forecasts
      # - key: SLA_METRICS_DIR
      #   value: /var/data/sla_metrics
      # - key: BATCH_RESULTS_DIR
      #   value: /var/data/batch_results
      # - key: INGESTION_STORAGE_DIR
      #   value: /var/data/ingestion_storage
      # - key: QUARANTINE_DIR
      #   value: /var/data/quarantined_batches
      # - key: ANOMALIES_DIR
      #   value: /var/data/anomalies
      # - key: SFTP_DIR
      #   value: /var/data/incoming_sftp

      # Agent platform (Aava / CrewAI). Leave an ID blank to have that stage
      # report SKIPPED; there are no defaults. See AGENTS.md for the prompts.
      - key: CREWAI_ENABLED
        value: "true"
      - key: CREWAI_API_URL
        value: https://int-ai.aava.ai/agents/execute/agent-executions
      - key: CREWAI_RETRIEVAL_URL
        value: https://int-ai.aava.ai/agents/execute/history/execution
      - key: CREWAI_API_KEY
        sync: false
      - key: CREWAI_AGENT_FORECAST_ID
        sync: false
      - key: CREWAI_AGENT_ANOMALY_ID
        sync: false
      - key: CREWAI_AGENT_RECON_ID
        sync: false
      - key: CREWAI_AGENT_SLA_ID
        sync: false
      - key: CREWAI_AGENT_EXTRACTION_ID
        sync: false

      - key: AUTO_AGENT_DISPATCH
        value: "true"
      - key: SFTP_AUTO_INGEST
        value: "true"
