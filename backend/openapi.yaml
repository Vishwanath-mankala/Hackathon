openapi: 3.1.0
info:
  title: Reconciliation & Feed Processing API
  description: Production-ready FastAPI REST API backend wrapping feed generation,
    structural gating, tiered rule engine reconciliation, and diagnostics.
  version: 1.0.0
paths:
  /api/pipeline/overview:
    get:
      tags:
      - Pipeline Orchestrator
      summary: Get Pipeline Overview
      description: Returns high-level telemetry, active batches, SLA alerts, and processing
        metrics.
      operationId: get_pipeline_overview_api_pipeline_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineOverview'
  /api/pipeline/batches:
    get:
      tags:
      - Pipeline Orchestrator
      summary: List Batches
      description: Lists all ingested batch records with current processing stage
        and ETA.
      operationId: list_batches_api_pipeline_batches_get
      parameters:
      - name: stage
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by stage
          title: Stage
        description: Filter by stage
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchRecord'
                title: Response List Batches Api Pipeline Batches Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/batches/{batch_id}:
    get:
      tags:
      - Pipeline Orchestrator
      summary: Get Batch
      description: Returns full batch lifecycle details, metrics, and gate results.
      operationId: get_batch_api_pipeline_batches__batch_id__get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/ingest:
    post:
      tags:
      - Pipeline Orchestrator
      summary: Ingest Batch File
      description: 'Ingests a complete bank statement file without splitting.

        Executes the structural gate and row-level anomaly pipeline automatically.'
      operationId: ingest_batch_file_api_pipeline_ingest_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_batch_file_api_pipeline_ingest_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/simulate-sftp:
    post:
      tags:
      - Pipeline Orchestrator
      summary: Simulate Sftp Ingestion
      description: Simulates real-world automated SFTP drop arrival of a bank statement
        batch.
      operationId: simulate_sftp_ingestion_api_pipeline_simulate_sftp_post
      parameters:
      - name: filename
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filename from sample batches to simulate SFTP arrival
          title: Filename
        description: Filename from sample batches to simulate SFTP arrival
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/batches/{batch_id}/gate:
    get:
      tags:
      - Pipeline Orchestrator
      summary: Get Batch Gate Details
      description: Returns the file-level structural gate inspection report.
      operationId: get_batch_gate_details_api_pipeline_batches__batch_id__gate_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuralGateDetails'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/batches/{batch_id}/anomalies:
    get:
      tags:
      - Pipeline Orchestrator
      summary: Get Batch Anomalies
      description: Returns detected row anomalies, auto-remediations, and human escalation
        queue.
      operationId: get_batch_anomalies_api_pipeline_batches__batch_id__anomalies_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status (AUTO_REMEDIATED, ESCALATED, etc.)
          title: Status
        description: Filter by status (AUTO_REMEDIATED, ESCALATED, etc.)
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by severity
          title: Severity
        description: Filter by severity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnomalyItem'
                title: Response Get Batch Anomalies Api Pipeline Batches  Batch Id  Anomalies
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/batches/{batch_id}/anomalies/{anomaly_id}/resolve:
    post:
      tags:
      - Pipeline Orchestrator
      summary: Resolve Human Escalation
      description: 'Analyst review action:

        - APPROVE: accepts suggested fix (re-enters rule engine for re-validation)

        - OVERRIDE: applies manual values

        - QUARANTINE: isolates row from matching'
      operationId: resolve_human_escalation_api_pipeline_batches__batch_id__anomalies__anomaly_id__resolve_post
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: anomaly_id
        in: path
        required: true
        schema:
          type: string
          title: Anomaly Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanResolveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/batches/{batch_id}/recon:
    get:
      tags:
      - Pipeline Orchestrator
      summary: Get Batch Reconciliation
      description: Returns GL tiered matching breakdown, matched pairs, and unmatched
        reconciling items.
      operationId: get_batch_reconciliation_api_pipeline_batches__batch_id__recon_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/batches/{batch_id}/estimator:
    get:
      tags:
      - Pipeline Orchestrator
      summary: Get Time Estimate
      description: Returns granular processing time breakdown, throughput benchmarks,
        and SLA compliance status.
      operationId: get_time_estimate_api_pipeline_batches__batch_id__estimator_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEstimate'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/batches/{batch_id}/publish:
    post:
      tags:
      - Pipeline Orchestrator
      summary: Publish Batch Results
      description: Broadcasts batch completion and reconciliation summary to downstream
        message bus.
      operationId: publish_batch_results_api_pipeline_batches__batch_id__publish_post
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishEvent'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/publish/events:
    get:
      tags:
      - Pipeline Orchestrator
      summary: Get Published Events
      description: Returns event history published to downstream consumers.
      operationId: get_published_events_api_pipeline_publish_events_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishEvent'
                title: Response Get Published Events Api Pipeline Publish Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pipeline/agent/status:
    get:
      tags:
      - Pipeline Orchestrator
      summary: Get Agent Status
      description: 'Returns the configuration and connectivity status of the external
        CrewAI

        or Multi-Agent platform API.'
      operationId: get_agent_status_api_pipeline_agent_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/pipeline/agent/test-connection:
    post:
      tags:
      - Pipeline Orchestrator
      summary: Test Agent Connection
      description: Tests live connectivity to the configured CrewAI agent platform.
      operationId: test_agent_connection_api_pipeline_agent_test_connection_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/feed/split:
    post:
      tags:
      - Feed Ingestion & Batching
      summary: Split Recon Source File
      description: Splits a raw recon export into internal cache (cache_gl_cashbook.csv)
        and sequential ingestion batches with a declared manifest. Accepts either
        a file upload or a server-local file path.
      operationId: split_feed_api_feed_split_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_split_feed_api_feed_split_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitReconResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feed/manifest:
    get:
      tags:
      - Feed Ingestion & Batching
      summary: Get Ingestion Manifest
      description: Reads and parses manifest.csv detailing sequence, row counts, and
        control totals for all batches.
      operationId: get_manifest_api_feed_manifest_get
      parameters:
      - name: manifest_path
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional custom manifest path
          title: Manifest Path
        description: Optional custom manifest path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feed/batches:
    get:
      tags:
      - Feed Ingestion & Batching
      summary: List Ingestion Batches
      description: Lists all batch CSV files currently generated and ready for ingestion
        processing.
      operationId: list_batches_api_feed_batches_get
      parameters:
      - name: batches_dir
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional custom batches directory
          title: Batches Dir
        description: Optional custom batches directory
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchesListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/gate/check-batch:
    post:
      tags:
      - Structural Gate Validation
      summary: Validate Single Batch File
      description: 'Applies 4 deterministic checks to a batch file: encoding, required
        header columns, record count vs declared count, and control total sum vs declared
        total.'
      operationId: check_batch_api_gate_check_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateResultSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/gate/check-all:
    post:
      tags:
      - Structural Gate Validation
      summary: Validate All Manifest Batches
      description: Executes structural gate checks on all batches registered in the
        manifest. Corrupt or inconsistent batches are automatically quarantined before
        reaching the rule engine.
      operationId: check_all_batches_api_gate_check_all_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateAllRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recon/run:
    post:
      tags:
      - Reconciliation Engine
      summary: Run Reconciliation Engine
      description: Runs the tiered waterfall rule engine against the cache and sequential
        ingestion batches. Validates structural integrity, applies tiers (Exact, Date
        Tolerance, Reference Match, Amount Tolerance), and produces matched, remaining
        cache, unmatched exceptions, and ambiguous reviews.
      operationId: run_reconciliation_api_recon_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recon/matches:
    get:
      tags:
      - Reconciliation Engine
      summary: Query Matched Transactions
      description: Returns paginated matched transactions with optional account and
        tier filtering.
      operationId: get_matches_api_recon_matches_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Items per page
          default: 50
          title: Page Size
        description: Items per page
      - name: account
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by account number/substring
          title: Account
        description: Filter by account number/substring
      - name: tier
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by match tier (e.g. TIER_1_EXACT)
          title: Tier
        description: Filter by match tier (e.g. TIER_1_EXACT)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recon/unmatched-cache:
    get:
      tags:
      - Reconciliation Engine
      summary: Query Remaining Unmatched Cache
      description: Returns paginated internal cashbook/GL rows that were never matched
        by ingestion files.
      operationId: get_unmatched_cache_api_recon_unmatched_cache_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Page Size
      - name: account
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Account
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recon/unmatched-ingest:
    get:
      tags:
      - Reconciliation Engine
      summary: Query Unmatched Ingestion Exceptions
      description: Returns paginated bank statement transactions that could not find
        a match in the internal cache.
      operationId: get_unmatched_ingest_api_recon_unmatched_ingest_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Page Size
      - name: account
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Account
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recon/ambiguous:
    get:
      tags:
      - Reconciliation Engine
      summary: Query Ambiguous Multi-Candidate Matches
      description: Returns paginated records where multiple candidates competed, detailing
        tie-breaker scores and decisions.
      operationId: get_ambiguous_matches_api_recon_ambiguous_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recon/download/{filename}:
    get:
      tags:
      - Reconciliation Engine
      summary: Download Result CSV
      description: Download any reconciliation output or manifest CSV file directly.
      operationId: download_csv_api_recon_download__filename__get
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/diagnostics/ambiguity:
    post:
      tags:
      - Diagnostics & Simulation
      summary: Diagnose Match Ambiguity
      description: Analyzes ambiguous matches from the latest reconciliation run.
        Identifies concentration of recurring amounts/accounts, assesses tie-breaker
        efficiency, and generates a diagnostic report.
      operationId: diagnose_ambiguity_api_diagnostics_ambiguity_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmbiguityDiagnosisRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmbiguityDiagnosisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/diagnostics/corrupt-batch:
    post:
      tags:
      - Diagnostics & Simulation
      summary: Simulate Batch Corruption (Chaos Testing)
      description: 'Injects a realistic real-world failure into a batch file to test
        structural gate enforcement. Modes include: truncate, dropped_row, duplicate_row,
        tampered_amount, missing_column, bad_encoding. Automatically creates a .bak
        backup.'
      operationId: corrupt_batch_api_diagnostics_corrupt_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorruptBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorruptBatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/diagnostics/restore-batch:
    post:
      tags:
      - Diagnostics & Simulation
      summary: Restore Corrupted Batch
      description: Restores a previously corrupted batch file back from its .bak backup
        copy.
      operationId: restore_batch_api_diagnostics_restore_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreBatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - System
      summary: Health Check
      description: System liveness and readiness health probe.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      tags:
      - System
      summary: Root
      description: Root redirect / discovery metadata.
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AmbiguityDiagnosisRequest:
      properties:
        results_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Results Dir
          description: Path to recon_results directory containing ambiguous_matches_for_review.csv.
            Defaults to config.
      type: object
      title: AmbiguityDiagnosisRequest
    AmbiguityDiagnosisResponse:
      properties:
        total_ambiguous:
          type: integer
          title: Total Ambiguous
        avg_candidates:
          type: number
          title: Avg Candidates
        max_candidates:
          type: integer
          title: Max Candidates
        ambiguity_by_tier:
          additionalProperties:
            type: integer
          type: object
          title: Ambiguity By Tier
        resolved_by_reference:
          anyOf:
          - type: integer
          - type: 'null'
          title: Resolved By Reference
        resolved_by_reference_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Resolved By Reference Pct
        top_accounts:
          additionalProperties:
            type: integer
          type: object
          title: Top Accounts
